[package]
name = "mnml-ratelimit"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Chris McLennan"]
description = "Cross-process token-bucket rate limiter for mnml integrations sharing a per-IP API budget (Bitbucket, Jira, etc.)."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-integrations"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
