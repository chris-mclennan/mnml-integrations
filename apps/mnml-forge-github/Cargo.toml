[package]
name = "mnml-forge-github"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "GitHub viewer for mnml — terminal TUI with workspace-wide PR + Actions tabs across every repo an owner has, plus legacy per-tab issues/actions kinds. Runs standalone or as an mnml-hosted pane."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-forge-github"
readme = "README.md"

[[bin]]
name = "mnml-forge-github"
path = "src/main.rs"

[dependencies]
mnml-bridge = "0.7"
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
url = "2"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"
