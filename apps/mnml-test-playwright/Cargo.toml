[package]
name = "mnml-test-playwright"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Playwright trace.zip viewer for mnml — terminal TUI for the per-action timeline, console messages, errors recorded by Playwright. Runs standalone or as an mnml-hosted pane. The test runner stays in mnml core (editor-integrated)."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-test-playwright"
readme = "README.md"

[[bin]]
name = "mnml-test-playwright"
path = "src/main.rs"

[dependencies]
mnml-bridge = { path = "../../../mnml/crates/mnml-bridge", version = "0.3" }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
