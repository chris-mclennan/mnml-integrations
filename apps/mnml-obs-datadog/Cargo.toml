[package]
name = "mnml-obs-datadog"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Datadog observability browser for mnml — terminal TUI for monitors, dashboards, logs, and traces. Shells out to the Datadog API (no SDK dep). Runs standalone today; v0.2 will support mnml-hosted pane mode."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-obs-datadog"
readme = "README.md"
authors = ["Chris McLennan"]

[[bin]]
name = "mnml-obs-datadog"
path = "src/main.rs"

[dependencies]
mnml-bridge = { path = "../../../mnml/crates/mnml-bridge", version = "0.4" }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true

[profile.dist]
inherits = "release"
lto = "thin"
