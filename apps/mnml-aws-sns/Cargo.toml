[package]
name = "mnml-aws-sns"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "AWS SNS topic + subscription browser for mnml — terminal TUI listing SNS topics with confirmed/pending subscription counts, drilling into per-topic subscription detail (endpoint, protocol, status). Pairs with mnml-aws-sqs for the canonical SNS → SQS fan-out pattern. Runs standalone or as an mnml-hosted pane. Shells out to the `aws` CLI; no SDK dep."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-aws-sns"
readme = "README.md"

[[bin]]
name = "mnml-aws-sns"
path = "src/main.rs"

[dependencies]
# 2026-08-01 — sibling-icons SDK requires mnml-bridge 0.4+ for the
# `ChipSpec::glyph_svg` / `glyph_codepoint` fields (Stage 2 of the
# sibling-owned icon migration — was baked into mnml core through 0.1.4).
mnml-bridge = { path = "../../../mnml/crates/mnml-bridge", version = "0.7" }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
