[package]
name = "mnml-msg-gcal"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Google Calendar browse + create for mnml — terminal TUI showing today, week ahead, and upcoming meetings, with quick-create. Uses Google Calendar API v3 with loopback OAuth (per-user GCP project required)."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-msg-gcal"
readme = "README.md"
authors = ["Chris McLennan"]
keywords = ["tui", "ratatui", "google-calendar", "mnml", "calendar"]
categories = ["command-line-utilities"]

[[bin]]
name = "mnml-msg-gcal"
path = "src/main.rs"

[dependencies]
mnml-bridge = { path = "../../../mnml/crates/mnml-bridge", version = "0.5" }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
