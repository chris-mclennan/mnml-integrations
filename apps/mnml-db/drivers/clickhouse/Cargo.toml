[package]
name = "mnml-db-driver-clickhouse"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ClickHouse driver crate for mnml-db — thin async wrapper around the ClickHouse HTTP endpoint (FORMAT JSON) exposing the driver-neutral QueryResult / schema-introspection shape."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-integrations"
keywords = ["mnml", "mnml-integration", "database"]
categories = ["database"]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
