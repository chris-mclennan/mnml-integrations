[package]
name = "mnml-db-driver-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Postgres driver crate for mnml-db — thin wrapper around tokio-postgres exposing the driver-neutral QueryResult / schema-introspection shape."

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-postgres = "0.7"
serde_json = "1"
