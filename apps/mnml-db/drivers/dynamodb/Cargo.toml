[package]
name = "mnml-db-driver-dynamodb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DynamoDB driver crate for mnml-db — shells out to the `aws` CLI (no AWS SDK dep), exposes the driver-neutral document QueryResult / schema-introspection shape."

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["process", "rt", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
