[package]
name = "mnml-meta-stats"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Download-stats report for the mnml crate family — pulls crates.io + GitHub Releases APIs for every mnml-* package and prints a table + 30-day sparklines. Runs standalone or as an mnml-hosted Pty pane."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-integrations"
readme = "README.md"

[[bin]]
name = "mnml-meta-stats"
path = "src/main.rs"

[dependencies]
mnml-bridge = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
