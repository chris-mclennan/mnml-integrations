[package]
name = "mnml-fs-s3"
version = "0.2.3"
edition = "2024"
license = "MIT"
authors = ["Chris McLennan"]
description = "Amazon S3 browser for mnml — terminal TUI for browsing buckets + prefixes, downloading + yanking URIs. Runs standalone or as an mnml-hosted pane. Shells out to the `aws` CLI; no SDK dep."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-fs-s3"
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "A18DA939-97CA-4115-ACA7-E6051D175790"
path-guid = "4B83A37D-6F2B-49D9-8213-666FDC0970F7"
license = false
eula = false

[[bin]]
name = "mnml-fs-s3"
path = "src/main.rs"

[dependencies]
mnml-bridge = { path = "../../../mnml/crates/mnml-bridge", version = "0.4" }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
