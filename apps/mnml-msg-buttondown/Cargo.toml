[package]
name = "mnml-msg-buttondown"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Buttondown newsletter browser for mnml — terminal TUI for drafts, sent emails, subscribers, and scheduled sends. Shells out to the Buttondown API (no SDK dep)."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-msg-buttondown"
readme = "README.md"
authors = ["Chris McLennan"]

[[bin]]
name = "mnml-msg-buttondown"
path = "src/main.rs"

[dependencies]
mnml-bridge = "0.7"
ratatui = "0.29"
unicode-width = "0.2"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"
