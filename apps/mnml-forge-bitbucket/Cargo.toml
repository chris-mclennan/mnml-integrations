[package]
name = "mnml-forge-bitbucket"
version = "0.3.29"
edition = "2024"
license = "MIT"
description = "Bitbucket Cloud viewer for mnml — pull requests + pipeline runs, workspace-scoped, with configurable tabs (per-repo, mine, reviewing). Runs standalone or as an mnml-hosted pane."
homepage = "https://mnml.sh"
repository = "https://github.com/chris-mclennan/mnml-forge-bitbucket"
readme = "README.md"

[[bin]]
name = "mnml-forge-bitbucket"
path = "src/main.rs"

[dependencies]
mnml-bridge = "0.7"
mnml-ratelimit = { path = "../../crates/mnml-ratelimit" }
mnml-chrome = { path = "../../crates/mnml-chrome" }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
url = "2"
webbrowser = "1"
base64 = "0.22"
# #1040 (2026-08-18) — client-side regex-match for
# `chip_excluded_branch_patterns`. Was server-side via BBQL but
# Bitbucket rejects `source.branch.name ~ …` as a filter (verified
# HTTP 400 body: "does not support filtering").
regex = "1"

[dev-dependencies]
tempfile = "3"
