# iftop — interactive bandwidth monitor.
#
# Requires raw-socket privileges on macOS/Linux — user may need to
# run mnml as root or grant CAP_NET_RAW to htop (depends on distro).
# Launcher fires as-is; if iftop fails inside the Pty it's a system
# permission issue, not an mnml one.
id = "iftop"
label = "iftop"
description = "Interactive bandwidth monitor"
category = "system"

[chip]
# nf-md-network (U+F06F3). Prior F0AF6 was md-alpha_i — corrected
# 2026-08-05 after inspecting the actual font.
glyph = "\U000F06F3"
fallback = "N"
color = "cyan"
enabled = true
in_palette_bar = false

[[commands]]
id = "iftop.open"
title = "iftop: open"
group = "system"
keys = ["<leader>iI"]
run = ":term iftop"
