# btop — resource monitor. cpu / mem / disk / net in one pane.
#
# The premium version of top / htop. Modern TUI with mouse support.
# Ships in most package managers as `btop` or `btop++`.
id = "btop"
label = "btop"
description = "Resource monitor (cpu / mem / disk / net)"
category = "system"

[chip]
# 2026-08-06 — user pref: red B, but at full-cell size.
# nf-md-alpha_b (U+F0AEF) is a letter-B glyph designed to fill
# the terminal cell, unlike a plain ASCII "B" which comes from
# the primary font at standard text size (smaller).
glyph = "\U000F0AEF"
fallback = "B"
color = "red"
enabled = true
in_palette_bar = false

[[commands]]
id = "btop.open"
title = "btop: open"
group = "system"
keys = ["<leader>iB"]
run = ":term btop"
