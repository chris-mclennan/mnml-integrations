# btop — resource monitor. cpu / mem / disk / net in one pane.
#
# The premium version of top / htop. Modern TUI with mouse support.
# Ships in most package managers as `btop` or `btop++`.
id = "btop"
label = "btop"
description = "Resource monitor (cpu / mem / disk / net)"
category = "system"

[chip]
# nf-md-server_network (U+F0AEF) — 2026-08-05 user pick over the
# prior PUA-baked glyph so btop reads as a monitor at a glance.
glyph = "\U000F0AEF"
fallback = "B"
color = "red"
enabled = true
in_palette_bar = false

[[commands]]
id = "btop.open"
title = "btop: open"
group = "system"
keys = ["<leader>iB"]
run = ":term btop"
