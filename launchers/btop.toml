# btop — resource monitor. cpu / mem / disk / net in one pane.
#
# The premium version of top / htop. Modern TUI with mouse support.
# Ships in most package managers as `btop` or `btop++`.
id = "btop"
label = "btop"
description = "Resource monitor (cpu / mem / disk / net)"
category = "system"

[chip]
# nf-md-monitor_dashboard (U+F0A07) — matches btop's real UI
# (multi-panel resource dashboard). Previous pick F0AEF was
# md-alpha_b (letter "B" glyph) — misidentified in the Nerd Fonts
# cheatsheet; corrected 2026-08-05 after inspecting the actual font.
glyph = "\U000F0A07"
fallback = "B"
color = "red"
enabled = true
in_palette_bar = false

[[commands]]
id = "btop.open"
title = "btop: open"
group = "system"
keys = ["<leader>iB"]
run = ":term btop"
