# btop — resource monitor. cpu / mem / disk / net in one pane.
#
# The premium version of top / htop. Modern TUI with mouse support.
# Ships in most package managers as `btop` or `btop++`.
id = "btop"
label = "btop"
description = "Resource monitor (cpu / mem / disk / net)"
category = "system"

[chip]
# 2026-08-06 — user pref: just the letter B in red. Simple ASCII
# glyph always renders (no font dependency). btop's real UI icon
# (nf-md-monitor_dashboard U+F0A07) is what the previous glyph
# was; kept in the fallback field so a `--ascii` render still
# shows something recognizable.
glyph = "B"
fallback = "B"
color = "red"
enabled = true
in_palette_bar = false

[[commands]]
id = "btop.open"
title = "btop: open"
group = "system"
keys = ["<leader>iB"]
run = ":term btop"
