# htop — interactive process viewer.
#
# Data-only launcher (no binary field). Fires `:term htop` in an
# mnml Pty pane. Requires the user to have `htop` installed on
# PATH. mnml's chip renders with the baked htop glyph at U+F0AF5.
id = "htop"
label = "htop"
description = "Interactive process viewer"
category = "system"

[chip]
# 2026-08-06 — swapped to a custom SVG glyph. mnml fetches
# `htop.svg` from this same folder on install, bakes into
# MnmlSymbols.ttf at U+F1D00 (pinned via `glyph_codepoint` so the
# bake is stable across users), then renders it here. Falls back
# to the "H" fallback letter if the user hasn't run
# `integrations.bake_integration_glyphs` yet.
glyph = "\U000F1D00"
glyph_svg = "htop.svg"
glyph_codepoint = "F1D00"
fallback = "H"
color = "green"
enabled = true
in_palette_bar = false

[[commands]]
id = "htop.open"
title = "htop: open"
group = "system"
keys = ["<leader>iH"]
run = ":term htop"
