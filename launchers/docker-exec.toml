# Docker exec — jump into a running container.
#
# Demonstrates the `{{prompt:name}}` reserved token (P5). The
# command's `run` field references `{{prompt:container}}` — at
# spawn time mnml pops a prompt asking the user which container
# to attach to. Falls back to literal until P5 wires the prompt
# subsystem through.
#
# Until then this launcher fires a broken command; disable it in
# your config to hide the chip. Kept in the reference catalog so
# future P5 verification has a concrete test case.
id = "docker-exec"
label = "Docker exec"
description = "Jump into a running container"
category = "container"

[chip]
glyph = ""
fallback = "DK"
color = "blue"
enabled = false
in_palette_bar = false

[[commands]]
id = "docker-exec.open"
title = "Docker: exec into container…"
group = "container"
run = ":term docker exec -it {{prompt:container}} bash"
