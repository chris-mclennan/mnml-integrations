# VSCode (and Cursor / Windsurf / Positron — all inherit the `code`
# CLI). Reference launcher that demonstrates parameterized actions.
#
# The `code` CLI opens an Electron GUI window, so these actions
# spawn the app externally rather than running in-terminal.
# NOTE: they still use `:term code` because mnml's :term pipes the
# stdout back — code writes some launch chatter to stdout before
# the GUI takes over. If that's annoying we can add a `:spawn`
# form later that fires-and-forgets.
id = "vscode"
label = "VSCode"
description = "Visual Studio Code (or fork)"
category = "editor"

[chip]
# nf-dev-vscode (U+E8DA) — swapped from cod-vscode (EC29) 2026-08-05
# because ghostty 1.3.1 doesn't route EC29 even with the codicon
# range extended past it. E8DA renders reliably in the Devicons
# range; both are official VS Code glyphs.
glyph = "\U0000E8DA"
fallback = "VS"
color = "blue"
enabled = true
in_palette_bar = false

[[commands]]
id = "vscode.open_workspace"
title = "VSCode: open workspace"
group = "editor"
keys = ["<leader>iv"]
run = ":term code {{workspace}}"

[[commands]]
id = "vscode.open_current_file"
title = "VSCode: open current file at cursor"
group = "editor"
keys = ["<leader>iV"]
run = ":term code --goto {{current_file_abs}}:{{cursor_line}}:{{cursor_col}}"

[[commands]]
id = "vscode.open_current_dir"
title = "VSCode: open current file's directory"
group = "editor"
run = ":term code {{current_file_dir}}"
