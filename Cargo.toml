[workspace]
resolver = "2"
members = [
    "apps/mnml-aws-amplify",
    "apps/mnml-aws-cloudwatch-logs",
    "apps/mnml-aws-codebuild",
    "apps/mnml-aws-cognito",
    "apps/mnml-aws-ecr",
    "apps/mnml-aws-ecs",
    "apps/mnml-aws-eventbridge",
    "apps/mnml-aws-lambda",
    "apps/mnml-aws-rds",
    "apps/mnml-aws-sns",
    "apps/mnml-aws-sqs",
    "apps/mnml-cdn-cloudflare",
    "apps/mnml-forge-azdevops",
    "apps/mnml-forge-bitbucket",
    "apps/mnml-forge-github",
    "apps/mnml-forge-gitlab",
    "apps/mnml-fs-azure-blob",
    "apps/mnml-fs-s3",
    "apps/mnml-msg-buttondown",
    "apps/mnml-msg-gcal",
    "apps/mnml-msg-gmail",
    "apps/mnml-msg-mandrill",
    "apps/mnml-meta-stats",
    "apps/mnml-msg-slack",
    "apps/mnml-msg-teams",
    "apps/mnml-obs-datadog",
    "apps/mnml-test-cypress",
    "apps/mnml-test-playwright",
    "apps/mnml-tracker-jira",
    "apps/mnml-virt-docker",
    # #1002 (2026-08-20) — shared cross-process rate limiter, Rust
    # port of tattle-claude-plugins/skills/bitbucket/shared/
    # bb_ratelimit.py. Consumed by integrations that share a per-IP
    # API budget (Bitbucket, Jira) via path-dep; publishable to
    # crates.io later so community integrations can opt in.
    "crates/mnml-chrome",
    "crates/mnml-ratelimit",
]

# Every member crate gets these shared dependency versions when it
# writes `foo = { workspace = true }` in its own Cargo.toml. Keeps
# versions locked across all apps in the monorepo.
exclude = [
    # mnml-db has its own nested workspace (7 driver crates).
    # Its own `cd apps/mnml-db && cargo build` handles it.
    "apps/mnml-db",
]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
mnml-bridge = { path = "../mnml/crates/mnml-bridge", version = "0.6" }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
webbrowser = "1"

# Shared release profile — every app in the monorepo inherits this.
# Optimized for binary size (siblings are small utilities, not
# perf-critical daemons).
[profile.release]
strip = true
opt-level = "z"
lto = true

# cargo-dist's release profile. Was declared in 12 individual app
# manifests where cargo silently ignored it (non-root profiles are
# ignored in a workspace); hoisted here so it actually applies.
[profile.dist]
inherits = "release"
lto = "thin"
